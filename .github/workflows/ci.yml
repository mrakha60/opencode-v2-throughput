name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Typecheck and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck

      # Guards the exact contract OpenCode enforces on load: a V2 plugin entrypoint
      # must default-export an object with a non-empty `id` and a `setup` function.
      - name: Verify plugin shape
        run: npx tsx scripts/verify-plugin-shape.ts

      # Exercises metric arithmetic, durable logging, and the benchmark tool
      # against a scripted v2 event stream.
      - name: Verify behavior
        run: npx tsx scripts/verify-behavior.ts