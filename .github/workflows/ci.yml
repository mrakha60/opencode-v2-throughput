name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Typecheck and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck

      # Guards the exact contract OpenCode enforces on load: a V2 plugin entrypoint
      # must default-export an object with a non-empty `id` and a `setup` function.
      - name: Verify plugin shape
        run: npx tsx scripts/verify-plugin-shape.ts

      # Exercises metric arithmetic, durable logging, benchmark reporting, and
      # resubscription after a dropped event stream.
      - name: Verify server plugin behavior
        run: npx tsx scripts/verify-behavior.ts

      # Exercises the TUI plugin's setup, event wiring, toasts, and cleanup.
      - name: Verify TUI plugin setup
        run: npx tsx scripts/verify-tui-setup.ts

      # A second physical @opentui/core must not break loading, which is the
      # failure mode of the published v1 package.
      - name: Check OpenTUI conflict
        run: npx tsx scripts/check-opentui-conflict.ts